<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34201a"/><stop offset="1" stop-color="#120b09"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset="0.45" stop-color="#f2b92e"/><stop offset="1" stop-color="#b57812"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#8a5a0c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)" stroke="#c58f1d" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="82" fill="none" stroke="#c58f1d" stroke-opacity="0.35" stroke-width="2"/>

  <!-- ticket stub -->
  <g transform="translate(46 300) rotate(-9)" filter="url(#sh)">
    <rect x="0" y="-70" width="250" height="140" rx="16" fill="#efe3c2"/>
    <circle cx="0" cy="-26" r="12" fill="#2a1810"/><circle cx="0" cy="26" r="12" fill="#2a1810"/>
    <line x1="26" y1="-46" x2="132" y2="-46" stroke="#b9a67a" stroke-width="4"/>
    <text x="24" y="24" font-family="Liberation Serif, Georgia, serif" font-weight="700" font-size="54" fill="#8c1f16">-110</text>
  </g>
  <!-- odds chip -->
  <g transform="translate(150 128) rotate(-8)" filter="url(#sh)">
    <rect x="-72" y="-34" width="144" height="68" rx="34" fill="#2f6b3a" stroke="#9fe0a8" stroke-width="4"/>
    <text x="0" y="17" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-weight="700" font-size="44" fill="#eaffec">+150</text>
  </g>

  <!-- coin -->
  <g filter="url(#sh)">
    <circle cx="322" cy="258" r="140" fill="url(#rim)"/>
    <circle cx="322" cy="258" r="128" fill="url(#gold)"/>
    <circle cx="322" cy="258" r="108" fill="none" stroke="#9a6410" stroke-width="5"/>
    <text x="322" y="300" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-weight="700" font-size="124" fill="#5a3708" stroke="#ffe9a0" stroke-width="2" stroke-opacity="0.5">SB</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-weight="700" font-size="34" letter-spacing="9" fill="#e8b84a">STEVEBOOK</text>
</svg>
