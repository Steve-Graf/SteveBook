name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests under Lua 5.1
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          for t in tests/test_*.lua; do echo "== $t"; lua5.1 "$t"; done

      - name: Stamp version into the .toc
        run: sed -i "s/^## Version:.*/## Version: ${GITHUB_REF_NAME#v}/" SteveBook/SteveBook.toc

      - name: Zip the addon folder (SteveBook/ is the zip root)
        run: zip -r "SteveBook-${GITHUB_REF_NAME}.zip" SteveBook

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "SteveBook-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
