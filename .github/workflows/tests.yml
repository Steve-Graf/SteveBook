name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run plain-Lua tests
        run: for t in tests/test_*.lua; do echo "== $t"; lua5.1 "$t"; done
